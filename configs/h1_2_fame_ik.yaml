# Sim orchestrator config: bare H1-2 (no gripper).
# Paths are resolved relative to this YAML's parent directory unless absolute.

mujoco:
  xml_path: "../../h12_adaptive_policy/h1_2/scene.xml"
  simulation_dt: 0.002
  # If true, no viewer is spawned; sim just steps.
  headless: false
  # Wall-clock duration cap. <=0 means run until interrupted.
  duration: 0.0
  # Hold the robot in the air for this many seconds at startup so processes can
  # warm up before gravity hits.
  warmup_seconds: 2.0

# H1-2 has 27 motors driven by the first 27 actuators of scene.xml; extra
# actuators after these (e.g. Magpie gripper) are held passively by the bridge.
robot:
  num_h12_motors: 27
  num_leg_motors: 12
  # 27-vector of warmup PD targets used until each motor is overridden by an
  # incoming mode=1 LowCmd. Order matches BODY_JOINTS in h12_ros2_controller.
  default_q:
    [-0.16, 0.0, 0.0,  0.36, -0.2, 0.0,
     -0.16, 0.0, 0.0,  0.36, -0.2, 0.0,
      0.0,
     -0.9,  0.0, 0.0,  0.5,  0.0,  0.0, 0.0,
     -0.9,  0.0, 0.0,  0.5,  0.0,  0.0, 0.0]
  default_kp:
    [200, 200, 200, 300,  60,  40,
     200, 200, 200, 300,  60,  40,
     200,
     500, 500, 500, 500, 500, 500, 500,
     500, 500, 500, 500, 500, 500, 500]
  default_kd:
    [5.0, 5.0, 5.0, 7.5, 1.0, 0.3,
     5.0, 5.0, 5.0, 7.5, 1.0, 0.3,
     10.0,
     5.0, 5.0, 5.0, 7.5, 1.0, 0.3, 0.0,
     5.0, 5.0, 5.0, 7.5, 1.0, 0.3, 0.0]

# Topics passed to all DDS participants (must match the safety_layer config).
topics:
  low_state: "rt/lowstate"
  low_cmd_out: "rt/lowcmd"
  low_cmd_lower_in: "rt/safety/lowcmd_lower_in"
  low_cmd_upper_in: "rt/safety/lowcmd_upper_in"
network:
  domain_id: 0
  interface: ""

# FAME (h12_adaptive_policy) settings.
fame:
  # Reuse the existing arm-mode RMA config; we override topic/xml/etc here.
  policy_path: "../../h12_adaptive_policy/data/rma_hand/policy.pt"
  encoder_path: "../../h12_adaptive_policy/data/rma_hand/encoder_3999.pt"
  policy_num_joints: 27
  obs_history_len: 3
  num_obs: 252
  single_obs_dim: 76
  num_actions: 12
  ang_vel_scale: 0.25
  dof_pos_scale: 1.0
  dof_vel_scale: 0.05
  action_scale: 0.25
  cmd_scale: [2.0, 2.0, 0.25]
  cmd_init: [0.0, 0.0, 0.0]
  height_cmd: 1.0
  control_decimation: 10  # 500Hz / 10 = 50 Hz policy rate
  publish_hz: 500.0
  default_angles_legs:
    [-0.16, 0.0, 0.0, 0.36, -0.2, 0.0,
     -0.16, 0.0, 0.0, 0.36, -0.2, 0.0]
  # Used as part of the e_t observation; mirrors mujoco_deploy_h12_rma.py.
  default_angles_arms:
    [0.0,
     -0.9, 0.0, 0.0, 0.5, 0.0, 0.0, 0.0,
     -0.9, 0.0, 0.0, 0.5, 0.0, 0.0, 0.0]
  legs_kp:
    [200, 200, 200, 300, 60, 40,
     200, 200, 200, 300, 60, 40]
  legs_kd:
    [5.0, 5.0, 5.0, 7.5, 1.0, 0.3,
     5.0, 5.0, 5.0, 7.5, 1.0, 0.3]
  left_hand_force: [0.0, 0.0, 0.0]
  right_hand_force: [0.0, 0.0, 0.0]
  # When true, the encoder receives zeros (sanity-check naive policy).
  no_encode: false

# IK driver (h12_ros2_controller FrameController) settings.
ik:
  # safety_split.yaml publishes upper-body to rt/safety/lowcmd_upper_in already.
  controller_config: "sim_split_controller.yaml"
  urdf_path:           "../../h12_ros2_controller/assets/h1_2/h1_2_handless.urdf"
  urdf_sphere_path:    "../../h12_ros2_controller/assets/h1_2/h1_2_handless_sphere.urdf"
  srdf_sphere_path:    "../../h12_ros2_controller/assets/h1_2/h1_2_handless_sphere_collision.srdf"
  handless: true
  visualize: false
  # Sequence of named configurations (from NAMED_CONFIGS) to step through. Each
  # entry holds for `seconds`. After the list is exhausted the driver holds the
  # last config until interrupted.
  goals:
    - name: "home"
      seconds: 20.0
