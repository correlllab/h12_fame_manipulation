# h12_ros2_controller config for SIM ONLY. Publishes upper-body commands to
# rt/safety/lowcmd_upper_in (matches the split-mode safety layer) and disables
# the internal estop checks that fire on the transient upper-body torques you
# see in Mujoco when the FrameController first locks the home pose.
# Do NOT use on the real robot.

mode: debug

topics:
  low_cmd: rt/safety/lowcmd_upper_in
  low_state: rt/lowstate

network:
  domain_id: 0
  interface: ''

controller:
  v_lim: 1.0
  w_lim: 2.0
  dq_lim: 1.0
  d_min: 0.02

frequency:
  ctrl_hz: 50
  pub_hz: 500
  check_hz: 1000

gains:
  kp:
    - 50.0 # left_hip_yaw_joint
    - 50.0 # left_hip_pitch_joint
    - 50.0 # left_hip_roll_joint
    - 50.0 # left_knee_joint
    - 50.0 # left_ankle_pitch_joint
    - 50.0 # left_ankle_roll_joint
    - 50.0 # right_hip_yaw_joint
    - 50.0 # right_hip_pitch_joint
    - 50.0 # right_hip_roll_joint
    - 50.0 # right_knee_joint
    - 50.0 # right_ankle_pitch_joint
    - 50.0 # right_ankle_roll_joint
    - 50.0 # torso_joint
    - 50.0 # left_shoulder_pitch_joint
    - 50.0 # left_shoulder_roll_joint
    - 50.0 # left_shoulder_yaw_joint
    - 50.0 # left_elbow_joint
    - 20.0 # left_wrist_roll_joint
    - 20.0 # left_wrist_pitch_joint
    - 20.0 # left_wrist_yaw_joint
    - 50.0 # right_shoulder_pitch_joint
    - 50.0 # right_shoulder_roll_joint
    - 50.0 # right_shoulder_yaw_joint
    - 50.0 # right_elbow_joint
    - 20.0 # right_wrist_roll_joint
    - 20.0 # right_wrist_pitch_joint
    - 20.0 # right_wrist_yaw_joint
  kd:
    - 8.0
    - 15.0
    - 15.0
    - 10.0
    - 5.0
    - 5.0
    - 8.0
    - 15.0
    - 15.0
    - 10.0
    - 5.0
    - 5.0
    - 10.0
    - 10.0
    - 10.0
    - 4.0
    - 4.0
    - 4.0
    - 4.0
    - 4.0
    - 10.0
    - 10.0
    - 4.0
    - 4.0
    - 4.0
    - 4.0
    - 4.0

limits:
  clip:
    position_offset: 0.05
    velocity_ratio: 0.10
    torque_ratio: 0.30
  # Sim estop disabled. Negative position_offset expands the estop window past
  # the URDF range; the velocity/torque ratios are well above URDF maxima so
  # the internal upper-body safety thread never fires during sim transients.
  estop:
    position_offset: -3.0
    velocity_ratio: 50.0
    torque_ratio: 50.0

logging:
  enabled: false
  base_dir: data/control_record
  filename: record
